
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التامورت - مراسلات</title>
<style>
body{margin:0;font-family:Arial;background:#f1f5f2}
header{background:#087d53;color:white;padding:22px;font-size:25px;font-weight:bold}
.subtitle{font-size:13px;margin-top:7px}
.container{padding:15px}
.search,input{width:100%;padding:14px;box-sizing:border-box;border:1px solid #ddd;border-radius:12px;font-size:16px}
.chat{background:white;padding:18px;margin-top:12px;border-radius:13px}
.chat b{font-size:18px}
.chat p{color:#777;margin-bottom:0}
button{background:#087d53;color:white;border:0;padding:14px;border-radius:12px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<header>
  التامورت
  <div class="subtitle">تواصل مع الجميع بسهولة وأمان</div>
</header>
<div class="container">
  <input class="search" placeholder="ابحث عن محادثة...">
  <div class="chat">
    <b>مرحباً بك في التامورت 👋</b>
    <p>تطبيق الخاص بك</p>
  </div>
  <div class="chat">
    <b>المحادثات</b>
    <p>لا توجد رسائل حتى الآن</p>
  </div>
  <div class="chat">
    <b>حسابي</b>
    <p>رقم الهاتف: +222</p>
  </div>
  <div class="chat">
    <b>لوحة تحكم المدير</b>
    <p>إدارة تطبيق التامورت</p>
  </div>
</div>
</body>
